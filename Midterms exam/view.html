<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Image Viewer — ARCHIVE Z</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="viewer-body">
  <header class="viewer-header">
    <a class="navbar-brand brand-mark" href="index.html"><span class="brand-orb">Z</span> ARCHIVE<span class="brand-z">Z</span></a>
    <a class="btn btn-outline-light viewer-back" href="index.html#database"><span aria-hidden="true">←</span> Back to database</a>
  </header>
  <main class="viewer-main">
    <p class="eyebrow section-eyebrow">ARCHIVE Z / IMAGE RECORD</p>
    <h1 id="viewerTitle">Character image</h1>
    <div class="viewer-frame" id="viewerFrame">
      <img id="viewerImage" alt="">
      <p class="viewer-error d-none" id="viewerError" role="status">This image could not be loaded. It may have moved or is unavailable.</p>
    </div>
    <p class="viewer-caption">Image supplied by the Dragon Ball API.</p>
  </main>
  <script type="module" src="js/viewer.js"></script>
</body>
</html>
